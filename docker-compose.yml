# Local stack: PostgreSQL + the app (API and frontend on http://localhost:8000).
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: medicare
      POSTGRES_DB: medicare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://medicare:medicare@db:5432/medicare
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      ENVIRONMENT: docker
      DEMO_BUGS_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]

volumes:
  pgdata:
